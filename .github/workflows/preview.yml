# Publica una copia del sitio por cada PR en
#   https://fredyxander.github.io/bailarines-del-sar/pr-preview/pr-<número>/
# y deja el link como comentario en el PR. Se borra al cerrar el PR.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./web/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
